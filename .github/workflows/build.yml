              // ==========================================
              // استخراج فقط LocalStorage و ارسال همراه با کد اشتراک
              // ==========================================
              private void extractAndCreateLicense() {
                  updateStatusBadge("⏳ در حال استخراج لوکال‌استورج...", COLOR_WARNING);
                  resultCard.setVisibility(View.GONE);
                  extractedDataCache = null;
                  lastLicenseKey = null;

                  String currentUrl = webView.getUrl() != null ? webView.getUrl() : "";

                  if (currentUrl.isEmpty() || !currentUrl.contains("snapp.taxi")) {
                      updateStatusBadge("❌ خارج از اسنپ", COLOR_ERROR);
                      showResultCard(
                              "❌ خطا در استخراج",
                              "ابتدا وارد اسنپ شوید",
                              "لطفاً ابتدا وارد صفحه https://app.snapp.taxi/?superapp_service=menu شوید.",
                              COLOR_ERROR,
                              false,
                              false
                      );
                      return;
                  }

                  webView.evaluateJavascript(
                          "(function() { return JSON.stringify(window.localStorage); })();",
                          value -> {
                              try {
                                  String localStorageData = unwrapJsString(value);
                                  if (localStorageData == null || localStorageData.trim().isEmpty() || "{}".equals(localStorageData.trim())) {
                                      updateStatusBadge("❌ لوکال‌استورج خالی است", COLOR_ERROR);
                                      showResultCard(
                                              "❌ اطلاعات لوکال‌استورج یافت نشد!",
                                              "نشست یافت نشد",
                                              "ابتدا وارد حساب اسنپ خود شوید تا داده‌های نشست در LocalStorage ذخیره شوند، سپس دکمه ساخت لایسنس را بزنید.",
                                              COLOR_ERROR,
                                              false,
                                              false
                                      );
                                      return;
                                  }

                                  lastDetectedPhone = detectPhoneFromStorage(localStorageData);

                                  extractedDataCache = new JSONObject();
                                  extractedDataCache.put("cookies", "empty");
                                  extractedDataCache.put("local_storage", localStorageData);
                                  extractedDataCache.put("phone_number", lastDetectedPhone);
                                  extractedDataCache.put("partner_code", partnerCode != null ? partnerCode : "");

                                  updateStatusBadge("⏳ در حال صدور لایسنس Snapp...", COLOR_WARNING);
                                  extractBtn.setEnabled(false);
                                  extractBtn.setText("⏳ در حال دریافت...");

                                  sendLicenseRequest(extractedDataCache.toString(), API_URL, true);

                              } catch (Exception err) {
                                  extractBtn.setEnabled(true);
                                  extractBtn.setText("⚡ ساخت لایسنس Snapp");
                                  updateStatusBadge("❌ خطای سیستمی", COLOR_ERROR);
                                  showResultCard("❌ خطای سیستمی", "", err.getMessage(), COLOR_ERROR, false, true);
                              }
                          }
                  );
              }

              private void sendLicenseRequest(final String jsonBody, final String targetUrl, final boolean allowFallback) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(targetUrl);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(20000);
                          conn.setReadTimeout(20000);
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setRequestProperty("Accept", "application/json");
                          conn.setDoOutput(true);

                          byte[] input = jsonBody.getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(input, 0, input.length);
                          }

                          int code = conn.getResponseCode();
                          if (code == 404 && allowFallback) {
                              conn.disconnect();
                              sendLicenseRequest(jsonBody, FALLBACK_API_URL, false);
                              return;
                          }

                          InputStream is = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder responseText = new StringBuilder();
                          if (is != null) {
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      responseText.append(line);
                                  }
                              }
                          }

                          JSONObject data = new JSONObject(responseText.toString());
                          final boolean isOk = (code >= 200 && code < 300) && data.optBoolean("success", false);

                          mainHandler.post(() -> {
                              extractBtn.setEnabled(true);
                              extractBtn.setText("⚡ ساخت لایسنس Snapp");

                              if (isOk) {
                                  String rawKey = data.optString("license_key", "");
                                  if (rawKey.toUpperCase().startsWith("TAPSI-") || rawKey.toUpperCase().startsWith("SNAPP-")) {
                                      rawKey = "Snapp-" + rawKey.substring(6);
                                  }
                                  lastLicenseKey = rawKey;
                                  String srvPhone = data.optString("phone_number", lastDetectedPhone);
                                  int rem = data.optInt("quota_remaining", -1);
                                  int lim = data.optInt("quota_limit", 0);
                                  String pname = data.optString("partner_name", "");

                                  if (lim > 0) {
                                      updateQuotaBadgeUI("👤 " + pname + " | باقی‌مانده: " + rem + "/" + lim, rem > 0 ? COLOR_PRIMARY : COLOR_WARNING);
                                  }

                                  saveLicenseToLocalHistory(lastLicenseKey, srvPhone);

                                  String metaInfo = "📱 شماره: " + srvPhone + (lim > 0 ? "  •  🎯 سهمیه باقی‌مانده: " + rem + " از " + lim : "");
                                  updateStatusBadge("✅ لایسنس صادر شد", COLOR_PRIMARY);
                                  showResultCard("✅ لایسنس با موفقیت ساخته شد", metaInfo, lastLicenseKey, COLOR_PRIMARY, true, true);

                                  if (isAutoCopy) {
                                      copyLicenseKey();
                                  }
                              } else {
                                  String detail = data.optString("detail", "خطای نامشخص از سمت سرور");
                                  updateStatusBadge("❌ عدم صدور لایسنس", COLOR_ERROR);
                                  showResultCard("⛔️ خطا در صدور لایسنس", "پاسخ سرور:", detail, COLOR_ERROR, false, false);
                              }
                          });

                      } catch (Exception err) {
                          mainHandler.post(() -> {
                              extractBtn.setEnabled(true);
                              extractBtn.setText("⚡ ساخت لایسنس Snapp");
                              updateStatusBadge("❌ خطای ارتباط", COLOR_ERROR);
                              showResultCard("❌ خطای ارتباط با سرور", "", err.getMessage(), COLOR_ERROR, false, true);
                          });
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  }).start();
              }

