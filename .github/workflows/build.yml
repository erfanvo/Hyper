              private static class ProxyConfig {
                  String raw;
                  String scheme; // HTTP, HTTPS, SOCKS5, SOCKS4
                  String host;
                  int port;
                  String username;
                  String password;

                  boolean hasAuth() {
                      return username != null && !username.isEmpty() && password != null;
                  }

                  boolean isSocks() {
                      return "SOCKS5".equals(scheme) || "SOCKS4".equals(scheme);
                  }

                  String getDisplayLabel() {
                      return (hasAuth() ? "🔒 " : "🌐 ") + scheme + "://" + host + ":" + port;
                  }

                  static ProxyConfig tryParse(String line) {
                      if (line == null) return null;
                      String s = line.trim();
                      if (s.isEmpty() || s.startsWith("#") || s.startsWith("//")) return null;

                      int commentIdx = s.indexOf(" #");
                      if (commentIdx > 0) {
                          s = s.substring(0, commentIdx).trim();
                      }

                      String scheme = "HTTP";
                      String lower = s.toLowerCase(Locale.ROOT);
                      if (lower.startsWith("socks5h://") || lower.startsWith("socks5://")) {
                          scheme = "SOCKS5";
                          s = s.substring(s.indexOf("://") + 3).trim();
                      } else if (lower.startsWith("socks4a://") || lower.startsWith("socks4://") || lower.startsWith("socks://")) {
                          scheme = "SOCKS4";
                          s = s.substring(s.indexOf("://") + 3).trim();
                      } else if (lower.startsWith("https://")) {
                          scheme = "HTTPS";
                          s = s.substring(8).trim();
                      } else if (lower.startsWith("http://")) {
                          scheme = "HTTP";
                          s = s.substring(7).trim();
                      }

                      if (s.endsWith("/")) {
                          s = s.substring(0, s.length() - 1).trim();
                      }

                      String user = null;
                      String pass = null;
                      String hostPart = s;

                      if (s.contains("@")) {
                          int atIdx = s.lastIndexOf('@');
                          String left = s.substring(0, atIdx).trim();
                          String right = s.substring(atIdx + 1).trim();

                          String[] rightParts = right.split(":");
                          String[] leftParts = left.split(":");

                          if (rightParts.length == 2 && parsePort(rightParts[1]) > 0) {
                              // user:pass@host:port
                              hostPart = right;
                              int colon = left.indexOf(':');
                              if (colon > 0) {
                                  user = urlDecodeSafe(left.substring(0, colon));
                                  pass = urlDecodeSafe(left.substring(colon + 1));
                              } else {
                                  user = urlDecodeSafe(left);
                                  pass = "";
                              }
                          } else if (leftParts.length == 2 && parsePort(leftParts[1]) > 0) {
                              // host:port@user:pass
                              hostPart = left;
                              int colon = right.indexOf(':');
                              if (colon > 0) {
                                  user = urlDecodeSafe(right.substring(0, colon));
                                  pass = urlDecodeSafe(right.substring(colon + 1));
                              } else {
                                  user = urlDecodeSafe(right);
                                  pass = "";
                              }
                          }
                      }

                      String[] parts = hostPart.split(":");
                      if (parts.length == 2) {
                          String host = parts[0].trim();
                          int port = parsePort(parts[1].trim());
                          if (host.isEmpty() || port <= 0) return null;
                          ProxyConfig cfg = new ProxyConfig();
                          cfg.raw = line.trim();
                          cfg.scheme = scheme;
                          cfg.host = host;
                          cfg.port = port;
                          cfg.username = user;
                          cfg.password = pass;
                          return cfg;
                      } else if (parts.length >= 4) {
                          int secondPort = parsePort(parts[1].trim());
                          int lastPort = parsePort(parts[parts.length - 1].trim());
                          if (secondPort > 0) {
                              // ip:port:user:pass
                              ProxyConfig cfg = new ProxyConfig();
                              cfg.raw = line.trim();
                              cfg.scheme = scheme;
                              cfg.host = parts[0].trim();
                              cfg.port = secondPort;
                              cfg.username = parts[2].trim();
                              StringBuilder sb = new StringBuilder();
                              for (int i = 3; i < parts.length; i++) {
                                  if (i > 3) sb.append(":");
                                  sb.append(parts[i]);
                              }
                              cfg.password = sb.toString().trim();
                              return cfg;
                          } else if (lastPort > 0) {
                              // user:pass:ip:port
                              ProxyConfig cfg = new ProxyConfig();
                              cfg.raw = line.trim();
                              cfg.scheme = scheme;
                              cfg.host = parts[parts.length - 2].trim();
                              cfg.port = lastPort;
                              cfg.username = parts[0].trim();
                              StringBuilder sb = new StringBuilder();
                              for (int i = 1; i < parts.length - 2; i++) {
                                  if (i > 1) sb.append(":");
                                  sb.append(parts[i]);
                              }
                              cfg.password = sb.toString().trim();
                              return cfg;
                          }
                      }
                      return null;
                  }

                  private static int parsePort(String s) {
                      try {
                          int p = Integer.parseInt(s.trim());
                          return (p > 0 && p <= 65535) ? p : -1;
                      } catch (Exception e) {
                          return -1;
                      }
                  }

                  private static String urlDecodeSafe(String s) {
                      try {
                          return URLDecoder.decode(s, "UTF-8");
                      } catch (Exception e) {
                          return s;
                      }
                  }
              }

              // ==========================================
              // مدل تخفیف و سرویس‌های تپسی
