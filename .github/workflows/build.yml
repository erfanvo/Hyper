                  root.addView(divider);

                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBar.setGravity(Gravity.CENTER_VERTICAL);
                  bottomBar.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  bottomBar.setPadding(dp(10), dp(8), dp(10), dp(10));

                  extractBtn = createActionButton(
                          "⚡ استخراج و ساخت لایسنس",
                          COLOR_ACCENT,
                          "#0F172A",
                          null
                  );
                  LinearLayout.LayoutParams extractParams = new LinearLayout.LayoutParams(
                          0, dp(44), 1.35f);
                  extractParams.setMargins(0, 0, dp(5), 0);
                  extractBtn.setLayoutParams(extractParams);
                  extractBtn.setOnClickListener(v -> extractAndCreateLicense());

                  cleanBtn = createActionButton(
                          "🧹 نشست بعدی",
                          "#271A0C",
                          COLOR_WARNING,
                          COLOR_WARNING
                  );
                  LinearLayout.LayoutParams cleanParams = new LinearLayout.LayoutParams(
                          0, dp(44), 0.85f);
                  cleanParams.setMargins(dp(5), 0, 0, 0);
                  cleanBtn.setLayoutParams(cleanParams);
                  cleanBtn.setOnClickListener(v -> performDeepClean());

                  bottomBar.addView(extractBtn);
                  bottomBar.addView(cleanBtn);
                  root.addView(bottomBar);

                  setContentView(root);
                  webView.loadUrl(TAPSI_START_URL);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  String defaultUa = settings.getUserAgentString();
                  if (defaultUa != null) {
                      settings.setUserAgentString(defaultUa.replace("; wv", ""));
                  }

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          injectPopupRedirectHelper();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          CookieManager.getInstance().flush();
                          injectPopupRedirectHelper();
                          captureCurrentLocalStorage();
                      }
                  });
              }

              private void injectPopupRedirectHelper() {
                  webView.evaluateJavascript(
                          "(function() {" +
                          "  window.open = function(url) { if (url) { window.location.href = url; } return window; };" +
                          "  document.addEventListener('click', function(e) {" +
                          "    var a = e.target && e.target.closest ? e.target.closest('a[target=\"_blank\"]') : null;" +
                          "    if (a && a.href) { a.removeAttribute('target'); }" +
                          "  }, true);" +
                          "})();",
                          null
                  );
              }

              private void captureCurrentLocalStorage() {
                  webView.evaluateJavascript(
                          "(function() { try { return JSON.stringify(window.localStorage); } catch(e) { return '{}'; } })();",
                          value -> {
                              try {
                                  String rawJson = unwrapJsString(value);
                                  if (rawJson != null && rawJson.startsWith("{")) {
                                      JSONObject obj = new JSONObject(rawJson);
                                      Iterator<String> keys = obj.keys();
                                      while (keys.hasNext()) {
                                          String k = keys.next();
                                          sessionLocalStorageCache.put(k, obj.optString(k, ""));
                                      }
                                  }
                              } catch (Exception ignored) {
                              }
                          }
                  );
              }

              // ==========================================
              // 1. استخراج و ساخت لایسنس (بدون نیاز به ورود به مارکت)
              // ==========================================
              private void extractAndCreateLicense() {
                  updateStatusBadge("⏳ در حال استخراج...", COLOR_WARNING);
                  resultCard.setVisibility(View.GONE);
                  extractedDataCache = null;
                  lastLicenseKey = null;

                  String currentUrl = webView.getUrl() != null ? webView.getUrl() : "";
                  if (currentUrl.isEmpty() || (!currentUrl.contains("tapsi.cab") && !currentUrl.contains("tapsi.ir") && !currentUrl.contains("tapsi.markets"))) {
                      updateStatusBadge("❌ خارج از تپسی", COLOR_ERROR);
                      showResultCard("❌ خطا در استخراج", "لطفاً ابتدا وارد سایت تپسی شوید.", COLOR_ERROR, false, false);
                      return;
                  }

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.flush();

                  String[] allTapsiUrls = new String[]{
                          "https://tapsi.cab",
                          "https://app.tapsi.cab",
                          "https://api.tapsi.cab",
                          "https://accounts.tapsi.cab",
                          "https://tapsi.ir",
                          "https://www.tapsi.ir",
                          "https://market.tapsi.ir",
                          "https://supermarket.tapsi.ir",
                          "https://api.tapsi.ir",
                          "https://tapsi.markets",
                          "https://app.tapsi.markets",
                          currentUrl
                  };

                  Map<String, String> allCookies = collectCookiesForUrls(cookieManager, allTapsiUrls);

                  StringBuilder cookieBuilder = new StringBuilder();
                  for (Map.Entry<String, String> entry : allCookies.entrySet()) {
                      if (cookieBuilder.length() > 0) {
                          cookieBuilder.append("; ");
                      }
                      cookieBuilder.append(entry.getKey()).append("=").append(entry.getValue());
                  }
                  final String cookieString = cookieBuilder.toString();

                  webView.evaluateJavascript(
                          "(function() { try { return JSON.stringify(window.localStorage); } catch(e) { return '{}'; } })();",
                          value -> {
                              try {
                                  JSONObject mergedStorage = new JSONObject();
                                  for (Map.Entry<String, String> entry : sessionLocalStorageCache.entrySet()) {
                                      mergedStorage.put(entry.getKey(), entry.getValue());
                                  }

                                  String currentLsRaw = unwrapJsString(value);
                                  if (currentLsRaw != null && currentLsRaw.startsWith("{")) {
                                      JSONObject currentLsObj = new JSONObject(currentLsRaw);
                                      Iterator<String> keys = currentLsObj.keys();
                                      while (keys.hasNext()) {
                                          String k = keys.next();
                                          String v = currentLsObj.optString(k, "");
                                          mergedStorage.put(k, v);
                                          sessionLocalStorageCache.put(k, v);
                                      }
                                  }

                                  String localStorageData = mergedStorage.toString();

                                  extractedDataCache = new JSONObject();
                                  extractedDataCache.put("cookies", cookieString.isEmpty() ? "empty" : cookieString);
                                  extractedDataCache.put("local_storage", localStorageData.isEmpty() ? "{}" : localStorageData);
                                  extractedDataCache.put("phone_number", "unknown");

                                  updateStatusBadge("⏳ در حال صدور لایسنس...", COLOR_WARNING);
                                  extractBtn.setEnabled(false);
                                  extractBtn.setText("⏳ در حال دریافت...");

                                  sendLicenseRequest(extractedDataCache.toString());

                              } catch (Exception err) {
                                  extractBtn.setEnabled(true);
                                  extractBtn.setText("⚡ استخراج و ساخت لایسنس");
                                  updateStatusBadge("❌ خطای سیستمی", COLOR_ERROR);
                                  showResultCard("❌ خطای سیستمی", err.getMessage(), COLOR_ERROR, false, true);
                              }
                          }
                  );
              }

              private void sendLicenseRequest(final String jsonBody) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(API_URL);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(20000);
                          conn.setReadTimeout(20000);
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setRequestProperty("Accept", "application/json");
                          conn.setDoOutput(true);

                          byte[] input = jsonBody.getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(input, 0, input.length);
                          }

                          int code = conn.getResponseCode();
                          InputStream is = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder responseText = new StringBuilder();
                          if (is != null) {
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      responseText.append(line);
                                  }
                              }
                          }

                          JSONObject data = new JSONObject(responseText.toString());
                          final boolean isOk = (code >= 200 && code < 300) && data.optBoolean("success", false);

                          mainHandler.post(() -> {
                              extractBtn.setEnabled(true);
                              extractBtn.setText("⚡ استخراج و ساخت لایسنس");

                              if (isOk) {
                                  lastLicenseKey = data.optString("license_key", "");
                                  updateStatusBadge("✅ لایسنس صادر شد", COLOR_SUCCESS);
                                  showResultCard("✅ لایسنس با موفقیت ساخته شد", lastLicenseKey, COLOR_ACCENT, true, true);
                              } else {
                                  String detail = data.optString("detail", "نامشخص");
                                  updateStatusBadge("❌ خطای سرور", COLOR_ERROR);
                                  showResultCard("❌ خطا از سمت سرور", detail, COLOR_ERROR, false, true);
                              }
                          });

                      } catch (Exception err) {
                          mainHandler.post(() -> {
                              extractBtn.setEnabled(true);
                              extractBtn.setText("⚡ استخراج و ساخت لایسنس");
                              updateStatusBadge("❌ خطای ارتباط", COLOR_ERROR);
                              showResultCard("❌ خطای ارتباط با سرور", err.getMessage(), COLOR_ERROR, false, true);
                          });
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  }).start();
              }

              // ==========================================
              // 2. کپی کلید لایسنس و اطلاعات خام
              // ==========================================
              private void copyLicenseKey() {
                  if (lastLicenseKey != null && !lastLicenseKey.isEmpty()) {
                      ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      ClipData clip = ClipData.newPlainText("HyperLink License Key", lastLicenseKey);
                      clipboard.setPrimaryClip(clip);
                      Toast.makeText(this, "✅ کلید لایسنس کپی شد!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void copyExtractedData() {
                  if (extractedDataCache != null) {
                      try {
                          String textToCopy = extractedDataCache.toString(2);
                          ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          ClipData clip = ClipData.newPlainText("HyperLink Extracted Data", textToCopy);
                          clipboard.setPrimaryClip(clip);
                          Toast.makeText(this, "✅ اطلاعات JSON خام کپی شد!", Toast.LENGTH_SHORT).show();
                      } catch (Exception err) {
                          Toast.makeText(this, "❌ خطا در کپی: " + err.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              // ==========================================
              // 3. پاک‌سازی عمیق برای نشست بعدی
              // ==========================================
              private void performDeepClean() {
                  updateStatusBadge("🧹 در حال پاک‌سازی...", COLOR_WARNING);
                  resultCard.setVisibility(View.GONE);

                  try {
                      sessionLocalStorageCache.clear();
                      extractedDataCache = null;
                      lastLicenseKey = null;

                      webView.evaluateJavascript(
                              "(function() { try { window.localStorage.clear(); window.sessionStorage.clear(); } catch(e) {} })();",
                              null
                      );

                      WebStorage.getInstance().deleteAllData();

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.removeAllCookies(value -> {
                          cookieManager.flush();
                          webView.clearCache(true);
                          webView.clearFormData();
                          webView.clearHistory();
                          webView.loadUrl(TAPSI_START_URL);

                          updateStatusBadge("✅ آماده برای نشست جدید", COLOR_SUCCESS);
                          Toast.makeText(this, "✅ مرورگر پاک‌سازی و رفرش شد", Toast.LENGTH_SHORT).show();
                      });

                  } catch (Exception err) {
                      updateStatusBadge("❌ خطا در پاک‌سازی", COLOR_ERROR);
                  }
              }

              // ==========================================
              // توابع کمکی رابط کاربری
              // ==========================================
              private void updateStatusBadge(String text, String colorHex) {
                  statusBadge.setText(text);
                  statusBadge.setTextColor(Color.parseColor(colorHex));
              }

              private void showResultCard(String title, String content, String contentColorHex, boolean showLicenseCopy, boolean showRawCopy) {
                  resultTitleView.setText(title);
                  licenseValueView.setText(content != null ? content : "");
                  licenseValueView.setTextColor(Color.parseColor(contentColorHex));

                  copyLicenseBtn.setVisibility(showLicenseCopy ? View.VISIBLE : View.GONE);
                  copyRawBtn.setVisibility(showRawCopy ? View.VISIBLE : View.GONE);
                  copyActionsRow.setVisibility((showLicenseCopy || showRawCopy) ? View.VISIBLE : View.GONE);

                  resultCard.setVisibility(View.VISIBLE);
              }

              private Map<String, String> collectCookiesForUrls(CookieManager cm, String[] urls) {
                  Map<String, String> map = new LinkedHashMap<>();
                  for (String u : urls) {
                      if (u == null || u.isEmpty()) continue;
                      String raw = cm.getCookie(u);
                      if (raw != null && !raw.trim().isEmpty()) {
                          String[] pairs = raw.split(";");
                          for (String pair : pairs) {
                              String trimmed = pair.trim();
                              int idx = trimmed.indexOf('=');
                              if (idx > 0) {
                                  String k = trimmed.substring(0, idx).trim();
                                  String v = trimmed.substring(idx + 1).trim();
                                  map.put(k, v);
                              }
                          }
                      }
                  }
                  return map;
              }

              private String unwrapJsString(String value) {
                  if (value == null || "null".equals(value)) {
                      return "{}";
                  }
                  try {
                      Object tok = new JSONTokener(value).nextValue();
                      return tok != null ? tok.toString() : "{}";
                  } catch (Exception e) {
                      return "{}";
                  }
              }

              private Button createActionButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  btn.setSingleLine(true);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(10));
                  if (strokeHex != null) {
                      bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  }
                  btn.setBackground(bg);
                  btn.setPadding(dp(8), 0, dp(8), 0);
                  return btn;
              }

              private Button createHeaderButton(String text) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(COLOR_TEXT_MAIN));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(COLOR_BG_CARD));
                  bg.setCornerRadius(dp(8));
                  bg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  btn.setBackground(bg);
                  btn.setPadding(dp(10), dp(4), dp(10), dp(4));
                  btn.setMinHeight(0);
                  btn.setMinimumHeight(0);
                  btn.setMinWidth(0);
                  btn.setMinimumWidth(0);
                  return btn;
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          value,
                          getResources().getDisplayMetrics()
                  );
              }

              private void requestLocationPermissionsIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 1001);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (resultCard != null && resultCard.getVisibility() == View.VISIBLE) {
                      resultCard.setVisibility(View.GONE);
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HyperLink-Extractor-v1.3.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperLink-Extractor-APK
          path: HyperLink-Extractor-v1.3.apk

      - name: Create GitHub Release (Optional Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: "HyperLink Extractor APK (Build #${{ github.run_number }})"
          files: HyperLink-Extractor-v1.3.apk
