              private List<String> parseLicensesList() {
                  String raw = licensesInput != null ? licensesInput.getText().toString() : "";
                  String[] parts = raw.split("[\\r\\n,;\\s]+");
                  Set<String> seen = new LinkedHashSet<>();
                  for (String p : parts) {
                      String clean = p.trim();
                      if (!clean.isEmpty()) seen.add(clean);
                  }
                  return new ArrayList<>(seen);
              }

              private List<ProxyConfig> parseProxiesList() {
                  String raw = proxiesInput != null ? proxiesInput.getText().toString() : "";
                  String[] lines = raw.split("[\\r\\n]+");
                  List<ProxyConfig> list = new ArrayList<>();
                  Set<String> seen = new HashSet<>();
                  for (String line : lines) {
                      ProxyConfig cfg = ProxyConfig.tryParse(line);
                      if (cfg != null) {
                          String k = cfg.scheme + ":" + cfg.host + ":" + cfg.port + ":" + (cfg.username != null ? cfg.username : "");
                          if (seen.add(k)) list.add(cfg);
                      }
                  }
                  return list;
              }

              private void refreshCountsUI() {
                  int lCount = parseLicensesList().size();
                  int pCount = parseProxiesList().size();
                  int withDisc = 0;
                  int totalDisc = 0;
                  synchronized (resultsList) {
                      for (AccountDiscountResult r : resultsList) {
                          if (r.hasDiscounts()) withDisc++;
                          totalDisc += r.discounts.size();
                      }
                  }

                  if (licensesCountLabel != null) {
                      licensesCountLabel.setText("تعداد لایسنس‌های شناسایی‌شده: " + lCount);
                  }
                  if (proxiesCountLabel != null) {
                      proxiesCountLabel.setText("پروکسی‌های معتبر شناسایی‌شده: " + pCount);
                  }
                  if (statLicensesChip != null) statLicensesChip.setText("🔑 لایسنس: " + lCount);
                  if (statProxiesChip != null) statProxiesChip.setText("🌐 پروکسی: " + pCount);
                  if (statWithDiscountChip != null) statWithDiscountChip.setText("🎁 تخفیف‌دار: " + withDisc);
                  if (statTotalDiscountsChip != null) statTotalDiscountsChip.setText("🏷 کل تخفیف: " + totalDisc);
                  if (tabResultsBtn != null) tabResultsBtn.setText("۲. تخفیف‌ها (" + withDisc + ")");
              }

              private String extractCookiesString(JSONObject dataObj) {
                  Object raw = dataObj.opt("cookies");
                  if (raw instanceof String) return (String) raw;
                  if (raw instanceof JSONObject) {
                      JSONObject obj = (JSONObject) raw;
                      JSONArray names = obj.names();
                      if (names == null) return "";
                      List<String> pairs = new ArrayList<>();
                      for (int i = 0; i < names.length(); i++) {
                          String k = names.optString(i);
                          pairs.add(k + "=" + obj.optString(k));
                      }
                      return TextUtils.join("; ", pairs);
                  }
                  return "";
              }

              private String extractLocalStorageString(JSONObject dataObj) {
                  Object raw = dataObj.opt("local_storage");
                  if (raw instanceof String && !((String) raw).trim().isEmpty()) return (String) raw;
                  if (raw instanceof JSONObject) return raw.toString();
                  return "{}";
              }

              private String buildCompleteCookieHeader(String rawCookies, String localStorageRaw) {
                  Map<String, String> map = new LinkedHashMap<>();
                  if (rawCookies != null) {
                      for (String part : rawCookies.split(";")) {
                          String trimmed = part.trim();
                          int eq = trimmed.indexOf('=');
                          if (eq > 0) {
                              String k = trimmed.substring(0, eq).trim();
                              String v = trimmed.substring(eq + 1).trim();
                              if (!RESERVED_COOKIE_ATTRS.contains(k.toLowerCase(Locale.ROOT))) {
                                  map.put(k, v);
                              }
                          }
                      }
                  }
                  try {
                      JSONObject ls = new JSONObject(localStorageRaw);
                      JSONArray names = ls.names();
                      if (names != null) {
                          for (int i = 0; i < names.length(); i++) {
                              String k = names.optString(i);
                              String v = ls.optString(k, "").replace("\"", "").trim();
                              if (("accessToken".equals(k) || "access_token".equals(k)) && !v.isEmpty() && !map.containsKey("accessToken")) {
                                  map.put("accessToken", v);
                              }
                              if (("refreshToken".equals(k) || "refresh_token".equals(k)) && !v.isEmpty() && !map.containsKey("refreshToken")) {
                                  map.put("refreshToken", v);
                              }
                          }
                      }
                  } catch (Exception ignored) {}

                  List<String> out = new ArrayList<>();
                  for (Map.Entry<String, String> e : map.entrySet()) {
                      out.add(e.getKey() + "=" + e.getValue());
                  }
                  return TextUtils.join("; ", out);
              }

              private Map<String, String> extractAccountMetadata(JSONObject dataObj, String cookies, String localStorage) {
                  Map<String, String> meta = new HashMap<>();
                  String phone = dataObj.optString("phone_number", "");
                  if ("unknown".equalsIgnoreCase(phone)) phone = "";
                  String userId = "";
                  String accessToken = "";
                  String marketJwt = "";
                  String cerberusId = "";

                  if (cookies != null) {
                      for (String part : cookies.split(";")) {
                          String trimmed = part.trim();
                          int eq = trimmed.indexOf('=');
                          if (eq > 0) {
                              String k = trimmed.substring(0, eq).trim();
                              String v = trimmed.substring(eq + 1).trim();
                              if ("accessToken".equals(k) || "access_token".equals(k)) {
                                  accessToken = v;
                              }
                          }
                      }
                  }

                  Pattern jwtPat = Pattern.compile("eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+");
                  for (String src : new String[]{cookies != null ? cookies : "", localStorage != null ? localStorage : ""}) {
                      Matcher m = jwtPat.matcher(src);
                      while (m.find()) {
                          String jwt = m.group(0);
                          JSONObject payload = decodeJwtPayload(jwt);
                          if (payload == null) continue;
                          String uname = payload.optString("username", payload.optString("phone_number", ""));
                          if (phone.isEmpty() && !uname.isEmpty()) phone = uname;
                          String uid = payload.optString("userId", payload.optString("sub", ""));
                          if (userId.isEmpty() && !uid.isEmpty()) userId = uid;
                          String cid = payload.optString("cerberusId", "");
                          if (!cid.isEmpty()) {
                              cerberusId = cid;
                              marketJwt = jwt;
                          }
                          if (accessToken.isEmpty()) accessToken = jwt;
                      }
                  }

                  meta.put("phone", phone);
                  meta.put("userId", userId);
                  meta.put("accessToken", accessToken);
                  meta.put("marketJwt", marketJwt);
                  meta.put("cerberusId", cerberusId);
                  return meta;
              }

              private JSONObject decodeJwtPayload(String jwt) {
                  try {
                      String[] parts = jwt.split("\\.");
                      if (parts.length < 2) return null;
                      byte[] decoded = Base64.decode(parts[1], Base64.URL_SAFE | Base64.NO_PADDING | Base64.NO_WRAP);
                      return new JSONObject(new String(decoded, StandardCharsets.UTF_8));
                  } catch (Exception e) {
                      return null;
                  }
              }

