              private void refreshPartnerQuotaSilent() {
                  if (partnerCode == null || partnerCode.isEmpty()) {
                      updateQuotaBadgeUI("🔑 ثبت کد اشتراک", COLOR_WARNING);
                      return;
                  }
                  updateQuotaBadgeUI("⏳ استعلام...", COLOR_TEXT_MUTED);
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(PARTNER_STATUS_URL + URLEncoder.encode(partnerCode, "UTF-8"));
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);

                          int code = conn.getResponseCode();
                          if (code == 200) {
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = br.readLine()) != null) sb.append(line);
                              JSONObject obj = new JSONObject(sb.toString());
                              final String name = obj.optString("name", "همکار");
                              final int rem = obj.optInt("remaining", 0);
                              final int lim = obj.optInt("limit", 0);
                              final boolean active = obj.optBoolean("active", true);
                              mainHandler.post(() -> {
                                  if (!active) {
                                      updateQuotaBadgeUI("🚫 مسدود (" + name + ")", COLOR_ERROR);
                                  } else if (rem <= 0) {
                                      updateQuotaBadgeUI("⚠️ اتمام سهمیه (0/" + lim + ")", COLOR_ERROR);
                                  } else {
                                      updateQuotaBadgeUI("👤 " + name + " | باقی‌مانده: " + rem + "/" + lim, COLOR_PRIMARY);
                                  }
                              });
                          } else {
                              mainHandler.post(() -> updateQuotaBadgeUI("❌ کد نامعتبر", COLOR_ERROR));
                          }
                      } catch (Exception e) {
                          mainHandler.post(() -> updateQuotaBadgeUI("🔑 " + partnerCode, COLOR_CYAN));
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

