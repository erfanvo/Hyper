              private void requestLocationPermissionsIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 1001);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (resultCard != null && resultCard.getVisibility() == View.VISIBLE) {
                      resultCard.setVisibility(View.GONE);
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snapp-Studio-Pro-v2.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapp-Studio-Pro-APK
          path: Snapp-Studio-Pro-v2.0.apk

      - name: Create GitHub Release (Optional Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: snapp-studio-v2.0.${{ github.run_number }}
          name: "Snapp Studio Pro APK (Build #${{ github.run_number }})"
          files: Snapp-Studio-Pro-v2.0.apk
