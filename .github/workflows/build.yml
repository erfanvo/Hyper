name: Build HyperLink APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Studio Project Files
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/hyperlink/extractor
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HyperLinkExtractor"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.hyperlink.extractor'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.hyperlink.extractor"
                  minSdk 23
                  targetSdk 34
                  versionCode 13
                  versionName "1.3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M60,22L32,60h20l-6,26l30,-38H56z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">HyperLink</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/hyperlink/extractor/MainActivity.java
          package ir.hyperlink.extractor;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;
          import org.json.JSONTokener;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.Map;

          public class MainActivity extends Activity {

              private static final String TAPSI_START_URL = "https://app.tapsi.cab";
              private static final String API_URL = "https://testtok-production1.up.railway.app/api/tapsi/create-license";

              // پالت رنگی مدرن و یکدست
              private static final String COLOR_BG_BAR = "#0F172A";
              private static final String COLOR_BG_CARD = "#1E293B";
              private static final String COLOR_BORDER = "#334155";
              private static final String COLOR_ACCENT = "#38BDF8";
              private static final String COLOR_SUCCESS = "#10B981";
              private static final String COLOR_WARNING = "#F59E0B";
              private static final String COLOR_ERROR = "#F87171";
              private static final String COLOR_TEXT_MAIN = "#F8FAFC";
              private static final String COLOR_TEXT_MUTED = "#94A3B8";

              private WebView webView;
              private ProgressBar progressBar;

              private TextView statusBadge;
              private LinearLayout resultCard;
              private TextView resultTitleView;
              private TextView licenseValueView;
              private LinearLayout copyActionsRow;
              private Button copyLicenseBtn;
              private Button copyRawBtn;
              private Button extractBtn;
              private Button cleanBtn;

              private JSONObject extractedDataCache = null;
              private String lastLicenseKey = null;
              private final Map<String, String> sessionLocalStorageCache = new LinkedHashMap<>();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor(COLOR_BG_BAR));
                      getWindow().setNavigationBarColor(Color.parseColor(COLOR_BG_BAR));
                  }

                  requestLocationPermissionsIfNeeded();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  // ==========================================
                  // 1. هدر باریک و شیک بالا (48dp)
                  // ==========================================
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  topBar.setPadding(dp(12), dp(8), dp(12), dp(8));

                  TextView brandTitle = new TextView(this);
                  brandTitle.setText("⚡ HyperLink");
                  brandTitle.setTextColor(Color.parseColor(COLOR_ACCENT));
                  brandTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  brandTitle.setTypeface(Typeface.DEFAULT_BOLD);

                  statusBadge = new TextView(this);
                  statusBadge.setText("آماده به کار");
                  statusBadge.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  statusBadge.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  statusBadge.setSingleLine(true);
                  statusBadge.setEllipsize(TextUtils.TruncateAt.END);
                  GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setColor(Color.parseColor(COLOR_BG_CARD));
                  badgeBg.setCornerRadius(dp(12));
                  statusBadge.setBackground(badgeBg);
                  statusBadge.setPadding(dp(10), dp(4), dp(10), dp(4));
                  LinearLayout.LayoutParams badgeParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  badgeParams.setMargins(dp(10), 0, dp(10), 0);
                  statusBadge.setLayoutParams(badgeParams);

                  Button reloadBtn = createHeaderButton("🔄 رفرش");
                  reloadBtn.setOnClickListener(v -> {
                      if (webView != null) webView.reload();
                  });

                  Button homeBtn = createHeaderButton("🏠 تپسی");
                  LinearLayout.LayoutParams homeParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  homeParams.setMargins(dp(6), 0, 0, 0);
                  homeBtn.setLayoutParams(homeParams);
                  homeBtn.setOnClickListener(v -> {
                      if (webView != null) webView.loadUrl(TAPSI_START_URL);
                  });

                  topBar.addView(brandTitle);
                  topBar.addView(statusBadge);
                  topBar.addView(reloadBtn);
                  topBar.addView(homeBtn);
                  root.addView(topBar);

                  // نوار پیشرفت باریک
                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(2)));
                  root.addView(progressBar);

                  // ==========================================
                  // 2. بخش میانی: مرورگر تمام‌صفحه + کارت شناور نتیجه
                  // ==========================================
                  FrameLayout centerContainer = new FrameLayout(this);
                  LinearLayout.LayoutParams centerParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f);
                  centerContainer.setLayoutParams(centerParams);

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setupWebView();
                  centerContainer.addView(webView);

                  // کارت شناور نمایش لایسنس و پیام‌ها در پایین صفحه وب
                  resultCard = new LinearLayout(this);
                  resultCard.setOrientation(LinearLayout.VERTICAL);
                  resultCard.setVisibility(View.GONE);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(Color.parseColor("#F21E293B"));
                  cardBg.setCornerRadius(dp(14));
                  cardBg.setStroke(dp(1), Color.parseColor(COLOR_ACCENT));
                  resultCard.setBackground(cardBg);
                  resultCard.setPadding(dp(14), dp(12), dp(14), dp(12));

                  FrameLayout.LayoutParams cardParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM);
                  cardParams.setMargins(dp(12), dp(12), dp(12), dp(10));
                  resultCard.setLayoutParams(cardParams);

                  // ردیف بالای کارت شناور (عنوان + دکمه بستن)
                  LinearLayout cardHeader = new LinearLayout(this);
                  cardHeader.setOrientation(LinearLayout.HORIZONTAL);
                  cardHeader.setGravity(Gravity.CENTER_VERTICAL);

                  resultTitleView = new TextView(this);
                  resultTitleView.setText("نتیجه استخراج");
                  resultTitleView.setTextColor(Color.parseColor(COLOR_TEXT_MAIN));
                  resultTitleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  resultTitleView.setTypeface(Typeface.DEFAULT_BOLD);
                  resultTitleView.setLayoutParams(new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextView closeCardBtn = new TextView(this);
                  closeCardBtn.setText("✕");
                  closeCardBtn.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  closeCardBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  closeCardBtn.setPadding(dp(8), dp(2), dp(4), dp(2));
                  closeCardBtn.setOnClickListener(v -> resultCard.setVisibility(View.GONE));

                  cardHeader.addView(resultTitleView);
                  cardHeader.addView(closeCardBtn);
                  resultCard.addView(cardHeader);

                  // متن کلید لایسنس یا خطا
                  licenseValueView = new TextView(this);
                  licenseValueView.setTextColor(Color.parseColor(COLOR_ACCENT));
                  licenseValueView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  licenseValueView.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  licenseValueView.setGravity(Gravity.CENTER);
                  licenseValueView.setTextIsSelectable(true);
                  GradientDrawable keyBoxBg = new GradientDrawable();
                  keyBoxBg.setColor(Color.parseColor(COLOR_BG_BAR));
                  keyBoxBg.setCornerRadius(dp(8));
                  licenseValueView.setBackground(keyBoxBg);
                  licenseValueView.setPadding(dp(10), dp(8), dp(10), dp(8));
                  LinearLayout.LayoutParams keyBoxParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  keyBoxParams.setMargins(0, dp(8), 0, dp(8));
                  licenseValueView.setLayoutParams(keyBoxParams);
                  resultCard.addView(licenseValueView);

                  // ردیف دکمه‌های کپی داخل کارت
                  copyActionsRow = new LinearLayout(this);
                  copyActionsRow.setOrientation(LinearLayout.HORIZONTAL);
                  copyActionsRow.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  copyLicenseBtn = createActionButton("🔑 کپی لایسنس", COLOR_SUCCESS, "#052E16", null);
                  LinearLayout.LayoutParams copyLicParams = new LinearLayout.LayoutParams(
                          0, dp(38), 1f);
                  copyLicParams.setMargins(0, 0, dp(4), 0);
                  copyLicenseBtn.setLayoutParams(copyLicParams);
                  copyLicenseBtn.setOnClickListener(v -> copyLicenseKey());

                  copyRawBtn = createActionButton("📋 کپی JSON خام", COLOR_BG_BAR, COLOR_ACCENT, COLOR_BORDER);
                  LinearLayout.LayoutParams copyRawParams = new LinearLayout.LayoutParams(
                          0, dp(38), 1f);
                  copyRawParams.setMargins(dp(4), 0, 0, 0);
                  copyRawBtn.setLayoutParams(copyRawParams);
                  copyRawBtn.setOnClickListener(v -> copyExtractedData());

                  copyActionsRow.addView(copyLicenseBtn);
                  copyActionsRow.addView(copyRawBtn);
                  resultCard.addView(copyActionsRow);

                  centerContainer.addView(resultCard);
                  root.addView(centerContainer);

                  // ==========================================
                  // 3. نوار عملیات پایین صفحه (Bottom Dock)
                  // ==========================================
                  View divider = new View(this);
                  divider.setBackgroundColor(Color.parseColor("#1E293B"));
                  divider.setLayoutParams(new LinearLayout.LayoutParams(
