name: Build Snapp Extractor Pro APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Studio Project Files
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/hyperlink/snapp/extractor
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnappExtractorPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.hyperlink.snapp.extractor'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.hyperlink.snapp.extractor"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#022C22"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#10B981"
                  android:pathData="M60,20L30,60h22l-6,28l32,-40H56z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Snapp Studio Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/hyperlink/snapp/extractor/MainActivity.java
          package ir.hyperlink.snapp.extractor;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.json.JSONTokener;

          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final String SNAPP_START_URL = "https://app.snapp.taxi/?superapp_service=menu";
              private static final String API_URL = "https://testtok-production1.up.railway.app/api/snapp/create-license";
              private static final String FALLBACK_API_URL = "https://testtok-production1.up.railway.app/api/tapsi/create-license";
              private static final String PARTNER_STATUS_URL = "https://testtok-production1.up.railway.app/api/snapp/partner-status/";

              private static final String PREFS_NAME = "snapp_studio_prefs";
              private static final String KEY_PARTNER_CODE = "partner_code";
              private static final String KEY_AUTO_COPY = "auto_copy";
              private static final String KEY_FAST_MODE = "fast_mode";
              private static final String KEY_LOCAL_HISTORY = "local_history_json";

              // پالت رنگی نئون دارک مدرن
              private static final String COLOR_BG_DEEP = "#090D16";
              private static final String COLOR_BG_SURFACE = "#111827";
              private static final String COLOR_BG_CARD = "#1E293B";
              private static final String COLOR_BORDER = "#334155";
              private static final String COLOR_PRIMARY = "#10B981";
              private static final String COLOR_PRIMARY_DARK = "#052E16";
              private static final String COLOR_CYAN = "#06B6D4";
              private static final String COLOR_WARNING = "#F59E0B";
              private static final String COLOR_ERROR = "#EF4444";
              private static final String COLOR_TEXT_MAIN = "#F8FAFC";
              private static final String COLOR_TEXT_MUTED = "#94A3B8";

              private SharedPreferences prefs;
              private WebView webView;
              private ProgressBar progressBar;

              private TextView statusBadge;
              private TextView quotaBadgeView;
              private Button fastModeBtn;
              private Button autoCopyBtn;
              private Button historyBtn;

              private LinearLayout resultCard;
              private TextView resultTitleView;
              private TextView resultMetaView;
              private TextView licenseValueView;
              private LinearLayout copyActionsRow;
              private Button copyLicenseBtn;
              private Button shareLicenseBtn;
              private Button copyRawBtn;
              private Button extractBtn;
              private Button cleanBtn;

              private JSONObject extractedDataCache = null;
              private String lastLicenseKey = null;
              private String lastDetectedPhone = "نامشخص";

              private boolean isFastMode = false;
              private boolean isAutoCopy = true;
              private String partnerCode = "";

              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor(COLOR_BG_DEEP));
                      getWindow().setNavigationBarColor(Color.parseColor(COLOR_BG_DEEP));
                  }

                  prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  partnerCode = prefs.getString(KEY_PARTNER_CODE, "");
                  isAutoCopy = prefs.getBoolean(KEY_AUTO_COPY, true);
                  isFastMode = prefs.getBoolean(KEY_FAST_MODE, false);

                  requestLocationPermissionsIfNeeded();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor(COLOR_BG_DEEP));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  // ==========================================
                  // 1. هدر مدرن بالا + نشانگر سهمیه اشتراک
                  // ==========================================
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setBackgroundColor(Color.parseColor(COLOR_BG_DEEP));
                  topBar.setPadding(dp(12), dp(10), dp(12), dp(6));

                  TextView brandTitle = new TextView(this);
                  brandTitle.setText("💎 Snapp Studio");
                  brandTitle.setTextColor(Color.parseColor(COLOR_PRIMARY));
                  brandTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  brandTitle.setTypeface(Typeface.DEFAULT_BOLD);

                  statusBadge = new TextView(this);
                  statusBadge.setText("در انتظار ورود به اسنپ");
                  statusBadge.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  statusBadge.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  statusBadge.setSingleLine(true);
                  statusBadge.setEllipsize(TextUtils.TruncateAt.END);
                  GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setColor(Color.parseColor(COLOR_BG_SURFACE));
                  badgeBg.setCornerRadius(dp(12));
                  badgeBg.setStroke(dp(1), Color.parseColor("#1E293B"));
                  statusBadge.setBackground(badgeBg);
                  statusBadge.setPadding(dp(10), dp(4), dp(10), dp(4));
                  LinearLayout.LayoutParams badgeParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  badgeParams.setMargins(dp(8), 0, dp(8), 0);
                  statusBadge.setLayoutParams(badgeParams);

                  quotaBadgeView = new TextView(this);
                  updateQuotaBadgeUI("🔑 ثبت کد اشتراک", COLOR_WARNING);
                  quotaBadgeView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  quotaBadgeView.setTypeface(Typeface.DEFAULT_BOLD);
                  quotaBadgeView.setPadding(dp(10), dp(5), dp(10), dp(5));
                  quotaBadgeView.setOnClickListener(v -> showPartnerCodeDialog());

                  topBar.addView(brandTitle);
                  topBar.addView(statusBadge);
                  topBar.addView(quotaBadgeView);
                  root.addView(topBar);

                  // ==========================================
                  // 2. نوار ابزار حرفه‌ای (اسکرول افقی ابزارهای کاربردی)
                  // ==========================================
                  HorizontalScrollView toolsScroll = new HorizontalScrollView(this);
                  toolsScroll.setHorizontalScrollBarEnabled(false);
                  toolsScroll.setBackgroundColor(Color.parseColor(COLOR_BG_DEEP));
                  toolsScroll.setPadding(dp(10), dp(2), dp(10), dp(8));

                  LinearLayout toolsRow = new LinearLayout(this);
                  toolsRow.setOrientation(LinearLayout.HORIZONTAL);
                  toolsRow.setGravity(Gravity.CENTER_VERTICAL);

                  Button homeBtn = createToolChip("🏠 منو اسنپ", false);
                  homeBtn.setOnClickListener(v -> {
                      if (webView != null) webView.loadUrl(SNAPP_START_URL);
                  });

                  Button reloadBtn = createToolChip("🔄 رفرش", false);
                  reloadBtn.setOnClickListener(v -> {
                      if (webView != null) webView.reload();
                  });

                  Button inspectBtn = createToolChip("🔍 بررسی نشست و شماره", false);
                  inspectBtn.setOnClickListener(v -> inspectCurrentSession());

                  historyBtn = createToolChip("📜 تاریخچه (" + getHistoryCount() + ")", false);
                  historyBtn.setOnClickListener(v -> showHistoryDialog());

                  autoCopyBtn = createToolChip(isAutoCopy ? "📋 کپی خودکار: روشن" : "📋 کپی خودکار: خاموش", isAutoCopy);
                  autoCopyBtn.setOnClickListener(v -> {
                      isAutoCopy = !isAutoCopy;
                      prefs.edit().putBoolean(KEY_AUTO_COPY, isAutoCopy).apply();
                      styleToolChip(autoCopyBtn, isAutoCopy ? "📋 کپی خودکار: روشن" : "📋 کپی خودکار: خاموش", isAutoCopy);
                      Toast.makeText(this, isAutoCopy ? "✅ کپی خودکار لایسنس فعال شد" : "⚠️ کپی خودکار غیرفعال شد", Toast.LENGTH_SHORT).show();
                  });

                  fastModeBtn = createToolChip(isFastMode ? "🚀 حالت سریع: روشن" : "🚀 حالت سریع: خاموش", isFastMode);
                  fastModeBtn.setOnClickListener(v -> {
                      isFastMode = !isFastMode;
                      prefs.edit().putBoolean(KEY_FAST_MODE, isFastMode).apply();
                      styleToolChip(fastModeBtn, isFastMode ? "🚀 حالت سریع: روشن" : "🚀 حالت سریع: خاموش", isFastMode);
                      Toast.makeText(this, isFastMode ? "🚀 حالت سریع فعال شد (حذف تصاویر سنگین)" : "🖼 بارگذاری عادی تصاویر فعال شد", Toast.LENGTH_SHORT).show();
                  });

                  toolsRow.addView(homeBtn);
                  toolsRow.addView(reloadBtn);
                  toolsRow.addView(inspectBtn);
                  toolsRow.addView(historyBtn);
                  toolsRow.addView(autoCopyBtn);
                  toolsRow.addView(fastModeBtn);
                  toolsScroll.addView(toolsRow);
                  root.addView(toolsScroll);

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(2)));
                  root.addView(progressBar);

                  // ==========================================
                  // 3. بخش میانی: وب‌ویو + کارت شناور مدرن نتیجه
                  // ==========================================
                  FrameLayout centerContainer = new FrameLayout(this);
                  LinearLayout.LayoutParams centerParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f);
                  centerContainer.setLayoutParams(centerParams);

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setupWebView();
                  centerContainer.addView(webView);

                  resultCard = new LinearLayout(this);
                  resultCard.setOrientation(LinearLayout.VERTICAL);
                  resultCard.setVisibility(View.GONE);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(Color.parseColor("#F5111827"));
                  cardBg.setCornerRadius(dp(16));
                  cardBg.setStroke(dp(1), Color.parseColor(COLOR_PRIMARY));
                  resultCard.setBackground(cardBg);
                  resultCard.setPadding(dp(16), dp(14), dp(16), dp(14));

                  FrameLayout.LayoutParams cardParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM);
                  cardParams.setMargins(dp(12), dp(12), dp(12), dp(12));
                  resultCard.setLayoutParams(cardParams);

                  LinearLayout cardHeader = new LinearLayout(this);
                  cardHeader.setOrientation(LinearLayout.HORIZONTAL);
                  cardHeader.setGravity(Gravity.CENTER_VERTICAL);

                  resultTitleView = new TextView(this);
                  resultTitleView.setText("نتیجه استخراج");
                  resultTitleView.setTextColor(Color.parseColor(COLOR_TEXT_MAIN));
                  resultTitleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  resultTitleView.setTypeface(Typeface.DEFAULT_BOLD);
                  resultTitleView.setLayoutParams(new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  TextView closeCardBtn = new TextView(this);
                  closeCardBtn.setText("✕");
                  closeCardBtn.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  closeCardBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  closeCardBtn.setPadding(dp(8), dp(2), dp(4), dp(2));
                  closeCardBtn.setOnClickListener(v -> resultCard.setVisibility(View.GONE));

                  cardHeader.addView(resultTitleView);
                  cardHeader.addView(closeCardBtn);
                  resultCard.addView(cardHeader);

                  resultMetaView = new TextView(this);
                  resultMetaView.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  resultMetaView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  resultMetaView.setPadding(0, dp(4), 0, dp(2));
                  resultCard.addView(resultMetaView);

                  licenseValueView = new TextView(this);
                  licenseValueView.setTextColor(Color.parseColor(COLOR_PRIMARY));
                  licenseValueView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  licenseValueView.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  licenseValueView.setGravity(Gravity.CENTER);
                  licenseValueView.setTextIsSelectable(true);
                  GradientDrawable keyBoxBg = new GradientDrawable();
                  keyBoxBg.setColor(Color.parseColor(COLOR_BG_DEEP));
                  keyBoxBg.setCornerRadius(dp(10));
                  keyBoxBg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  licenseValueView.setBackground(keyBoxBg);
                  licenseValueView.setPadding(dp(12), dp(10), dp(12), dp(10));
                  LinearLayout.LayoutParams keyBoxParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  keyBoxParams.setMargins(0, dp(8), 0, dp(10));
                  licenseValueView.setLayoutParams(keyBoxParams);
                  resultCard.addView(licenseValueView);

                  copyActionsRow = new LinearLayout(this);
                  copyActionsRow.setOrientation(LinearLayout.HORIZONTAL);
                  copyActionsRow.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  copyLicenseBtn = createActionButton("🔑 کپی لایسنس", COLOR_PRIMARY, COLOR_PRIMARY_DARK, null);
                  LinearLayout.LayoutParams copyLicParams = new LinearLayout.LayoutParams(
                          0, dp(38), 1f);
                  copyLicParams.setMargins(0, 0, dp(4), 0);
                  copyLicenseBtn.setLayoutParams(copyLicParams);
                  copyLicenseBtn.setOnClickListener(v -> copyLicenseKey());

                  shareLicenseBtn = createActionButton("📤 اشتراک", COLOR_BG_CARD, COLOR_CYAN, COLOR_BORDER);
                  LinearLayout.LayoutParams shareParams = new LinearLayout.LayoutParams(
                          0, dp(38), 0.85f);
                  shareParams.setMargins(dp(4), 0, dp(4), 0);
                  shareLicenseBtn.setLayoutParams(shareParams);
                  shareLicenseBtn.setOnClickListener(v -> shareSingleLicense());

                  copyRawBtn = createActionButton("📋 JSON خام", COLOR_BG_CARD, COLOR_TEXT_MAIN, COLOR_BORDER);
                  LinearLayout.LayoutParams copyRawParams = new LinearLayout.LayoutParams(
                          0, dp(38), 0.85f);
                  copyRawParams.setMargins(dp(4), 0, 0, 0);
                  copyRawBtn.setLayoutParams(copyRawParams);
                  copyRawBtn.setOnClickListener(v -> copyExtractedData());

                  copyActionsRow.addView(copyLicenseBtn);
                  copyActionsRow.addView(shareLicenseBtn);
                  copyActionsRow.addView(copyRawBtn);
                  resultCard.addView(copyActionsRow);

                  centerContainer.addView(resultCard);
                  root.addView(centerContainer);

                  // ==========================================
                  // 4. نوار عملیات پایین صفحه (Bottom Dock)
                  // ==========================================
                  View divider = new View(this);
                  divider.setBackgroundColor(Color.parseColor("#1E293B"));
                  divider.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(1)));
                  root.addView(divider);

                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBar.setGravity(Gravity.CENTER_VERTICAL);
                  bottomBar.setBackgroundColor(Color.parseColor(COLOR_BG_DEEP));
                  bottomBar.setPadding(dp(12), dp(10), dp(12), dp(12));

                  extractBtn = createActionButton(
                          "⚡ ساخت لایسنس Snapp",
                          COLOR_PRIMARY,
                          COLOR_PRIMARY_DARK,
                          null
                  );
                  LinearLayout.LayoutParams extractParams = new LinearLayout.LayoutParams(
                          0, dp(46), 1.4f);
                  extractParams.setMargins(0, 0, dp(6), 0);
                  extractBtn.setLayoutParams(extractParams);
                  extractBtn.setOnClickListener(v -> extractAndCreateLicense());

                  cleanBtn = createActionButton(
                          "🧹 نشست بعدی",
                          "#271A0C",
                          COLOR_WARNING,
                          COLOR_WARNING
                  );
                  LinearLayout.LayoutParams cleanParams = new LinearLayout.LayoutParams(
                          0, dp(46), 0.85f);
                  cleanParams.setMargins(dp(6), 0, 0, 0);
                  cleanBtn.setLayoutParams(cleanParams);
                  cleanBtn.setOnClickListener(v -> performDeepClean());

                  bottomBar.addView(extractBtn);
                  bottomBar.addView(cleanBtn);
                  root.addView(bottomBar);

                  setContentView(root);
                  webView.loadUrl(SNAPP_START_URL);

                  if (!partnerCode.isEmpty()) {
                      refreshPartnerQuotaSilent();
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  String defaultUa = settings.getUserAgentString();
                  if (defaultUa != null) {
                      settings.setUserAgentString(defaultUa.replace("; wv", ""));
                  }

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @SuppressLint("SetJavaScriptEnabled")
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView tempWebView = new WebView(MainActivity.this);
                          tempWebView.getSettings().setJavaScriptEnabled(true);
                          tempWebView.getSettings().setDomStorageEnabled(true);
                          tempWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  webView.loadUrl(request.getUrl().toString());
                                  v.destroy();
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  if (url != null && !url.equals("about:blank")) {
                                      webView.loadUrl(url);
                                      v.destroy();
                                  }
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(tempWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (isFastMode && request != null && request.getUrl() != null) {
                              String path = request.getUrl().getPath();
                              if (path != null) {
                                  String lower = path.toLowerCase();
                                  if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp") || lower.endsWith(".gif")) {
                                      return new WebResourceResponse("image/png", "UTF-8", new ByteArrayInputStream(new byte[0]));
                                  }
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          CookieManager.getInstance().flush();

                          if (url != null && url.contains("app.snapp.taxi")) {
                              updateStatusBadge("✅ داخل اسنپ (آماده ساخت لایسنس)", COLOR_PRIMARY);
                          }
                      }
                  });
              }

