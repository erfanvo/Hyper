              private static class DiscountItemModel {
                  String id;
                  List<String> categoryKeys = new ArrayList<>();
                  List<String> serviceTitles = new ArrayList<>();
                  String primaryColorHex = COLOR_ACCENT;
                  String type;
                  String title;
                  String description;
                  String couponCode;
                  String ventureDescription;
                  boolean expiring;

                  String getServicesLabel() {
                      if (serviceTitles.isEmpty()) return "🎁 عمومی";
                      return TextUtils.join(" ، ", serviceTitles);
                  }

                  boolean matchesFilter(String filter) {
                      if ("ALL".equals(filter)) return true;
                      String joined = (TextUtils.join(" ", categoryKeys) + " " + TextUtils.join(" ", serviceTitles)).toUpperCase(Locale.ROOT);
                      if ("FOOD".equals(filter)) {
                          return joined.contains("FOOD") || joined.contains("غذا") || joined.contains("فود");
                      }
                      if ("MARKET".equals(filter)) {
                          return joined.contains("MARKET") || joined.contains("سوپرمارکت") || joined.contains("مارکت");
                      }
                      if ("CAB".equals(filter)) {
                          return joined.contains("CAB") || joined.contains("خودرو") || joined.contains("تاکسی");
                      }
                      if ("DELIVERY".equals(filter)) {
                          return joined.contains("DELIVERY") || joined.contains("بسته") || joined.contains("پیک");
                      }
                      if ("SHOP".equals(filter)) {
                          return joined.contains("SHOP") || joined.contains("DARTIL") || joined.contains("فروشگاه");
                      }
                      if ("OTHER".equals(filter)) {
                          return joined.contains("GARAGE") || joined.contains("DOCTOR") || joined.contains("پزشک") || joined.contains("گاراژ");
                      }
                      return true;
                  }
              }

