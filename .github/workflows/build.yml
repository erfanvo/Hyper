              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              private void setupWebView(WebView wv) {
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUserAgentString(DEFAULT_USER_AGENT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);
                  }
                  CookieManager.getInstance().setAcceptCookie(true);

                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void onDiscountsCaptured(String jsonStr) {
                          if (jsonStr != null && jsonStr.contains("discounts")) {
                              capturedDiscountsJson = jsonStr;
                              CountDownLatch latch = webViewLatch;
                              if (latch != null) latch.countDown();
                          }
                      }
                  }, "DiscountBridge");

                  wv.setWebChromeClient(new WebChromeClient());
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectWebViewDiscountFetch(view);
                      }
                  });
              }

              private void injectWebViewDiscountFetch(WebView view) {
                  String safeLs = JSONObject.quote(activeLocalStorageRaw != null ? activeLocalStorageRaw : "{}");
                  String safeStep = JSONObject.quote(activeStepId);
                  String js = "(function() {" +
                          "  try {" +
                          "    var host = window.location.hostname || '';" +
                          "    var stepKey = '__dc_step_' + " + safeStep + ";" +
                          "    if (host.indexOf('tapsi.cab') !== -1) {" +
                          "      if (window.sessionStorage.getItem(stepKey) !== '1') {" +
                          "        window.localStorage.clear();" +
                          "        window.sessionStorage.setItem(stepKey, '1');" +
                          "        var d = JSON.parse(" + safeLs + ");" +
                          "        if (d && typeof d === 'object') {" +
                          "          for (var k in d) {" +
                          "            if (Object.prototype.hasOwnProperty.call(d, k)) {" +
                          "              window.localStorage.setItem(k, typeof d[k] === 'string' ? d[k] : JSON.stringify(d[k]));" +
                          "            }" +
                          "          }" +
                          "        }" +
                          "      }" +
                          "      setTimeout(function() {" +
                          "        fetch('https://api.tapsi.cab/api/v3/superApp/discountCenter/getDiscounts', {" +
                          "          method: 'GET', credentials: 'include', headers: {'Content-Type': 'application/json'}" +
                          "        }).then(function(r){return r.text();}).then(function(t){" +
                          "          if (t && t.indexOf('discounts') !== -1 && window.DiscountBridge) {" +
                          "            window.DiscountBridge.onDiscountsCaptured(t);" +
                          "          }" +
                          "        }).catch(function(e){});" +
                          "      }, 1000);" +
                          "    }" +
                          "  } catch(e) {}" +
                          "})();";
                  view.evaluateJavascript(js, null);
              }

              // ==========================================
              // اجرای اصلی بررسی لیست لایسنس‌ها
              // ==========================================
              private void startDiscountChecking() {
                  if (isRunning.get()) return;

                  final List<String> licenses = parseLicensesList();
                  if (licenses.isEmpty()) {
                      Toast.makeText(this, "❌ لطفاً ابتدا لیست لایسنس‌ها را وارد کنید", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  final List<ProxyConfig> proxies = parseProxiesList();
                  final boolean useProxy = useProxyCheck.isChecked() && !proxies.isEmpty();
                  final boolean randomOrder = randomProxyCheck.isChecked();
                  final boolean allowWvFallback = webViewFallbackCheck.isChecked();

                  isRunning.set(true);
                  stopRequested.set(false);
                  resultsList.clear();
                  rebuildResultsAndReportUI();

                  startCheckBtn.setEnabled(false);
                  stopBtn.setVisibility(View.VISIBLE);
                  progressBar.setVisibility(View.VISIBLE);
                  progressBar.setProgress(2);

                  appendLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
                  appendLog("🚀 شروع بررسی " + licenses.size() + " لایسنس | پروکسی فعال: " +
                          (useProxy ? proxies.size() + " عدد" : "خیر (مستقیم)"));

                  new Thread(() -> {
                      int withDiscount = 0;
                      int withoutDiscount = 0;
                      int errors = 0;

                      try {
                          for (int i = 0; i < licenses.size(); i++) {
                              if (stopRequested.get()) {
                                  appendLog("🛑 عملیات توسط کاربر متوقف شد.");
                                  break;
                              }

                              String key = licenses.get(i);
                              int idx = i + 1;
                              int prog = (int) (((float) i / licenses.size()) * 100);
                              updateStatus("در حال بررسی لایسنس " + idx + " از " + licenses.size() + " (" + maskKey(key) + ")...", COLOR_ACCENT, prog);

                              ProxyConfig proxy = null;
                              if (useProxy) {
                                  if (randomOrder) {
                                      proxy = proxies.get(random.nextInt(proxies.size()));
                                  } else {
                                      proxy = proxies.get(proxyCursor % proxies.size());
                                      proxyCursor++;
                                  }
                              }

                              appendLog("🔍 [" + idx + "/" + licenses.size() + "] لایسنس: " + maskKey(key) +
                                      " | " + (proxy != null ? proxy.getDisplayLabel() : "مستقیم"));

                              AccountDiscountResult res = checkSingleLicense(idx, key, proxy, proxies, allowWvFallback);

                              synchronized (resultsList) {
                                  resultsList.add(res);
                              }

                              if (!res.success) {
                                  errors++;
                                  appendLog("   ❌ خطا: " + res.errorMessage);
                              } else if (res.hasDiscounts()) {
                                  withDiscount++;
                                  appendLog("   🎉 یافت شد! " + res.discounts.size() + " تخفیف فعال (" +
                                          (!res.phone.isEmpty() ? res.phone : maskKey(key)) + "):");
                                  for (DiscountItemModel d : res.discounts) {
                                      String codeStr = (d.couponCode != null && !d.couponCode.isEmpty()) ? " | کد: " + d.couponCode : "";
                                      appendLog("      • [" + d.getServicesLabel() + "] " + d.title + " — " + d.description + codeStr);
                                  }
                                  if (res.questSummary != null && !res.questSummary.isEmpty()) {
                                      appendLog("      • 🎯 مأموریت: " + res.questSummary);
                                  }
                              } else {
                                  withoutDiscount++;
                                  appendLog("   ℹ️ بدون تخفیف فعال");
                              }

                              int doneProg = (int) (((float) (i + 1) / licenses.size()) * 100);
                              mainHandler.post(() -> {
                                  progressBar.setProgress(doneProg);
                                  refreshCountsUI();
                                  rebuildResultsAndReportUI();
                              });

                              if (i < licenses.size() - 1 && !stopRequested.get()) {
                                  Thread.sleep(650);
                              }
                          }

                          String summary = "✅ پایان بررسی | دارای تخفیف: " + withDiscount +
                                  " | بدون تخفیف: " + withoutDiscount + " | خطا: " + errors;
                          updateStatus(summary, withDiscount > 0 ? COLOR_SUCCESS : COLOR_WARNING, 100);
                          appendLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
                          appendLog("🏁 " + summary);

                          mainHandler.post(() -> {
                              rebuildResultsAndReportUI();
                              if (!resultsList.isEmpty()) {
                                  switchTab(1);
                              }
                          });

                      } catch (Exception e) {
                          appendLog("❌ خطای سیستمی: " + e.getMessage());
                          updateStatus("❌ خطا در اجرای بررسی", COLOR_ERROR, 0);
                      } finally {
                          isRunning.set(false);
                          mainHandler.post(() -> {
                              startCheckBtn.setEnabled(true);
                              stopBtn.setVisibility(View.GONE);
                          });
                      }
                  }).start();
              }

              private AccountDiscountResult checkSingleLicense(
                      int index,
                      String licenseKey,
                      ProxyConfig primaryProxy,
                      List<ProxyConfig> allProxies,
                      boolean allowWvFallback
              ) {
                  AccountDiscountResult result = new AccountDiscountResult();
                  result.index = index;
                  result.licenseKey = licenseKey;
                  result.proxyUsed = primaryProxy != null ? primaryProxy.getDisplayLabel() : "مستقیم (بدون پروکسی)";

                  try {
                      // ۱. دریافت اطلاعات لایسنس از سرور
                      String licUrl = LICENSE_API_BASE + URLEncoder.encode(licenseKey, "UTF-8");
                      HttpResult licHttp = executeHttpGet(licUrl, primaryProxy, null);
                      if ((licHttp.statusCode != 200 || licHttp.body == null) && primaryProxy != null) {
                          // تلاش مستقیم برای سرور لایسنس در صورت محدودیت پروکسی
                          licHttp = executeHttpGet(licUrl, null, null);
                      }

                      if (licHttp.body == null || licHttp.body.isEmpty()) {
                          result.success = false;
                          result.errorMessage = "عدم دریافت پاسخ از سرور لایسنس";
                          return result;
                      }

                      JSONObject licJson = new JSONObject(licHttp.body);
                      if (!licJson.optBoolean("success", false)) {
                          result.success = false;
                          result.errorMessage = licJson.optString("message", "لایسنس نامعتبر است");
                          return result;
                      }

                      JSONObject dataObj = licJson.optJSONObject("data");
                      if (dataObj == null) dataObj = licJson;

                      String cookiesRaw = extractCookiesString(dataObj);
                      String localStorageRaw = extractLocalStorageString(dataObj);
                      Map<String, String> meta = extractAccountMetadata(dataObj, cookiesRaw, localStorageRaw);

                      result.phone = meta.get("phone") != null ? meta.get("phone") : "";
                      result.userId = meta.get("userId") != null ? meta.get("userId") : "";

                      String cookieHeader = buildCompleteCookieHeader(cookiesRaw, localStorageRaw);
                      String accessToken = meta.get("accessToken");

                      // ۲. درخواست لیست تخفیف‌ها از مرکز تخفیف سوپراپ تپسی
                      ProxyConfig activeProxy = primaryProxy;
                      HttpResult discHttp = fetchDiscountsFromTapsi(cookieHeader, accessToken, activeProxy);

                      if ((discHttp.body == null || discHttp.statusCode != 200) && activeProxy != null) {
                          if (allProxies != null && allProxies.size() > 1) {
                              ProxyConfig backup = allProxies.get((proxyCursor++) % allProxies.size());
                              activeProxy = backup;
                              result.proxyUsed = backup.getDisplayLabel();
                              discHttp = fetchDiscountsFromTapsi(cookieHeader, accessToken, activeProxy);
                          }
                          if (discHttp.body == null || discHttp.statusCode != 200) {
                              activeProxy = null;
                              result.proxyUsed = "مستقیم (جایگزین پروکسی)";
                              discHttp = fetchDiscountsFromTapsi(cookieHeader, accessToken, null);
                          }
                      }

                      String validDiscountsBody = (discHttp.statusCode == 200 && discHttp.body != null && discHttp.body.contains("discounts"))
                              ? discHttp.body : null;

                      // ۳. در صورت انقضای کوکی (401/403)، تازه‌سازی نشست با WebView
                      if (validDiscountsBody == null && allowWvFallback) {
                          appendLog("   🔄 تلاش با مرورگر پشتیبان برای تازه‌سازی نشست...");
                          validDiscountsBody = fetchDiscountsViaWebViewFallback(licenseKey, cookiesRaw, localStorageRaw);
                      }

                      if (validDiscountsBody == null) {
                          result.success = false;
                          result.errorMessage = (discHttp.statusCode == 401 || discHttp.statusCode == 403)
                                  ? "نشست لایسنس منقضی شده است (کد " + discHttp.statusCode + ")"
                                  : "عدم دریافت پاسخ معتبر از سرور تخفیف تپسی";
                          return result;
                      }

                      // ۴. پردازش دسته‌بندی‌ها و آیتم‌های تخفیف
                      JSONObject discRoot = new JSONObject(validDiscountsBody);
                      Map<String, String> dynamicCats = new HashMap<>();
                      JSONArray catsArr = discRoot.optJSONArray("categories");
                      if (catsArr != null) {
                          for (int c = 0; c < catsArr.length(); c++) {
                              JSONObject cObj = catsArr.optJSONObject(c);
                              if (cObj != null) {
                                  String k = cObj.optString("key", "").trim();
                                  String t = cObj.optString("text", "").trim();
                                  if (!k.isEmpty() && !t.isEmpty()) {
                                      dynamicCats.put(k.toUpperCase(Locale.ROOT), t);
                                  }
                              }
                          }
                      }

                      JSONArray discountsArr = discRoot.optJSONArray("discounts");
                      if (discountsArr != null) {
                          for (int d = 0; d < discountsArr.length(); d++) {
                              JSONObject dObj = discountsArr.optJSONObject(d);
                              if (dObj == null) continue;
                              result.discounts.add(parseDiscountItem(dObj, dynamicCats));
                          }
                      }

                      // ۵. بررسی مأموریت فعال تپسی (passengerQuest)
                      try {
                          HttpResult questHttp = executeHttpGet(
                                  PASSENGER_QUEST_API,
                                  activeProxy,
                                  buildTapsiHeaders(cookieHeader, accessToken)
                          );
                          if (questHttp.statusCode == 200 && questHttp.body != null && questHttp.body.startsWith("{")) {
                              JSONObject qObj = new JSONObject(questHttp.body);
                              String qTitle = qObj.optString("title", "").trim();
                              String qScore = qObj.optString("score", "0").trim();
                              String qTarget = qObj.optString("target", "0").trim();
                              if (!qTitle.isEmpty() && !"0".equals(qTarget)) {
                                  result.questSummary = qTitle + " (پیشرفت: " + qScore + " از " + qTarget + ")";
                              }
                          }
                      } catch (Exception ignored) {}

                      // ۶. بررسی تخفیف‌های اختصاصی تپسی مارکت در صورت وجود توکن مارکت
                      String marketJwt = meta.get("marketJwt");
                      String cerberusId = meta.get("cerberusId");
                      if (marketJwt != null && !marketJwt.isEmpty() && cerberusId != null && !cerberusId.isEmpty()) {
                          try {
                              Map<String, String> mktHeaders = new LinkedHashMap<>();
                              mktHeaders.put("Accept", "application/json, text/plain, */*");
                              mktHeaders.put("X-Skip-Authorization", "false");
                              mktHeaders.put("ui-version", "2.0");
                              mktHeaders.put("source", "tapsiMarket");
                              mktHeaders.put("User-Agent", DEFAULT_USER_AGENT);
                              mktHeaders.put("Authorization", "Bearer " + marketJwt);

                              HttpResult mktHttp = executeHttpGet(
                                      TAPSI_MARKET_GATEWAY + "/api/discount/v1/discounts/customer/" + cerberusId,
                                      activeProxy,
                                      mktHeaders
                              );
                              if (mktHttp.statusCode == 200 && mktHttp.body != null && mktHttp.body.startsWith("{")) {
                                  JSONObject mktObj = new JSONObject(mktHttp.body);
                                  JSONArray mktData = mktObj.optJSONArray("data");
                                  if (mktData != null) {
                                      for (int m = 0; m < mktData.length(); m++) {
                                          JSONObject md = mktData.optJSONObject(m);
                                          if (md == null) continue;
                                          DiscountItemModel item = new DiscountItemModel();
                                          item.id = md.optString("id", "");
                                          item.categoryKeys.add("MARKET");
                                          item.serviceTitles.add("🛒 تپسی مارکت (سوپرمارکت)");
                                          item.primaryColorHex = COLOR_SUCCESS;
                                          item.type = "MARKET_COUPON";
                                          item.title = md.optString("title", md.optString("name", "تخفیف اختصاصی تپسی مارکت"));
                                          item.description = md.optString("description", "");
                                          item.couponCode = md.optString("code", md.optString("couponCode", ""));
                                          item.ventureDescription = "قابل استفاده در سوپرمارکت (تپسی مارکت)";
                                          item.expiring = false;
                                          result.discounts.add(item);
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                      }

                      result.success = true;
                      return result;

                  } catch (Exception e) {
                      result.success = false;
                      result.errorMessage = "خطا: " + e.getMessage();
                      return result;
                  }
              }

              private DiscountItemModel parseDiscountItem(JSONObject dObj, Map<String, String> dynamicCats) {
                  DiscountItemModel item = new DiscountItemModel();
                  item.id = dObj.optString("id", "");
                  item.type = dObj.optString("type", "COUPON");
                  item.title = dObj.optString("title", "تخفیف تپسی").trim();
                  item.description = dObj.optString("description", "").trim();
                  item.couponCode = dObj.optString("couponCode", dObj.optString("code", "")).trim();
                  item.ventureDescription = dObj.optString("ventureDescription", "").trim();
                  item.expiring = dObj.optBoolean("expiring", false);

                  JSONArray ckArr = dObj.optJSONArray("categoryKeys");
                  if (ckArr != null && ckArr.length() > 0) {
                      for (int i = 0; i < ckArr.length(); i++) {
                          String k = ckArr.optString(i, "").trim();
                          if (!k.isEmpty()) {
                              item.categoryKeys.add(k);
                              item.serviceTitles.add(resolveServiceLabel(k, dynamicCats));
                          }
                      }
                      item.primaryColorHex = resolveServiceColor(item.categoryKeys.get(0));
                  } else {
                      item.categoryKeys.add("GENERAL");
                      item.serviceTitles.add("🎁 عمومی / همه سرویس‌ها");
                      item.primaryColorHex = COLOR_ACCENT;
                  }
                  return item;
              }

              private String resolveServiceLabel(String rawKey, Map<String, String> dynamicCats) {
                  String upper = rawKey.trim().toUpperCase(Locale.ROOT);
                  switch (upper) {
                      case "TAPSI_CAB":
                      case "CAB":
                          return "🚕 تاکسی (خودرو)";
                      case "FOOD":
                      case "TAPSI_FOOD":
                          return "🍔 تپسی فود (غذا)";
                      case "MARKET":
                      case "SUPERMARKET":
                          return "🛒 تپسی مارکت (سوپرمارکت)";
                      case "TAPSI_DELIVERY":
                      case "DELIVERY":
                          return "📦 ارسال بسته (پیک)";
                      case "SHOP":
                      case "DARTIL":
                          return "🛍 فروشگاه (تپسی شاپ)";
                      case "GARAGE":
                          return "🔧 خدمات خودرو (گاراژ)";
                      case "DOCTOR":
                          return "🩺 پزشک و دارو";
                      default:
                          if (dynamicCats != null && dynamicCats.containsKey(upper)) {
                              return "🎁 " + dynamicCats.get(upper);
                          }
                          return "🎁 " + rawKey;
                  }
              }

              private String resolveServiceColor(String rawKey) {
                  String upper = rawKey.trim().toUpperCase(Locale.ROOT);
                  if (upper.contains("FOOD")) return COLOR_ORANGE;
                  if (upper.contains("MARKET")) return COLOR_SUCCESS;
                  if (upper.contains("DELIVERY")) return COLOR_WARNING;
                  if (upper.contains("SHOP") || upper.contains("DARTIL")) return COLOR_PURPLE;
                  if (upper.contains("DOCTOR")) return COLOR_PINK;
                  return COLOR_ACCENT;
              }

              // ==========================================
              // ارتباط شبکه با پشتیبانی کامل از انواع پروکسی
              // ==========================================
              private static class HttpResult {
                  int statusCode;
                  String body;
              }

              private Map<String, String> buildTapsiHeaders(String cookieHeader, String accessToken) {
                  Map<String, String> h = new LinkedHashMap<>();
                  h.put("Accept", "application/json, text/plain, */*");
                  h.put("Content-Type", "application/json");
                  h.put("Origin", "https://app.tapsi.cab");
                  h.put("Referer", "https://app.tapsi.cab/discount-center/");
                  h.put("x-agent", "v2.2|passenger|WEBAPP|7.81.0|5.0");
                  h.put("User-Agent", DEFAULT_USER_AGENT);
                  if (cookieHeader != null && !cookieHeader.isEmpty()) {
                      h.put("Cookie", cookieHeader);
                  }
                  if (accessToken != null && !accessToken.isEmpty()) {
                      h.put("Authorization", accessToken.startsWith("Bearer ") ? accessToken : "Bearer " + accessToken);
                  }
                  return h;
              }

              private HttpResult fetchDiscountsFromTapsi(String cookieHeader, String accessToken, ProxyConfig proxy) {
                  HttpResult r1 = executeHttpGet(DISCOUNT_CENTER_API, proxy, buildTapsiHeaders(cookieHeader, null));
                  if (r1.statusCode == 200 && r1.body != null && r1.body.contains("discounts")) {
                      return r1;
                  }
                  if (accessToken != null && !accessToken.isEmpty()) {
                      HttpResult r2 = executeHttpGet(DISCOUNT_CENTER_API, proxy, buildTapsiHeaders(cookieHeader, accessToken));
                      if (r2.statusCode == 200 && r2.body != null && r2.body.contains("discounts")) {
                          return r2;
                      }
                  }
                  return r1;
              }

              private HttpResult executeHttpGet(String urlStr, final ProxyConfig proxyCfg, Map<String, String> headers) {
                  HttpResult res = new HttpResult();
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(urlStr);
                      if (proxyCfg != null) {
                          Proxy.Type type = proxyCfg.isSocks() ? Proxy.Type.SOCKS : Proxy.Type.HTTP;
                          Proxy proxy = new Proxy(type, new InetSocketAddress(proxyCfg.host, proxyCfg.port));
                          if (proxyCfg.hasAuth()) {
                              Authenticator.setDefault(new Authenticator() {
                                  @Override
                                  protected PasswordAuthentication getPasswordAuthentication() {
                                      return new PasswordAuthentication(
                                              proxyCfg.username,
                                              proxyCfg.password.toCharArray()
                                      );
                                  }
                              });
                          }
                          conn = (HttpURLConnection) url.openConnection(proxy);
                          if (proxyCfg.hasAuth()) {
                              String cred = proxyCfg.username + ":" + proxyCfg.password;
                              String encoded = Base64.encodeToString(cred.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                              conn.setRequestProperty("Proxy-Authorization", "Basic " + encoded);
                          }
                      } else {
                          conn = (HttpURLConnection) url.openConnection();
                      }

                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(15000);
                      conn.setInstanceFollowRedirects(true);

                      if (headers != null) {
                          for (Map.Entry<String, String> entry : headers.entrySet()) {
                              conn.setRequestProperty(entry.getKey(), entry.getValue());
                          }
                      }

                      res.statusCode = conn.getResponseCode();
                      InputStream is = (res.statusCode >= 200 && res.statusCode < 400)
                              ? conn.getInputStream()
                              : conn.getErrorStream();

                      if (is != null) {
                          BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) {
                              sb.append(line).append("\n");
                          }
                          reader.close();
                          res.body = sb.toString().trim();
                      }
                  } catch (Exception e) {
                      res.statusCode = -1;
                      res.body = null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
                  return res;
              }

              private String fetchDiscountsViaWebViewFallback(String licenseKey, String cookiesRaw, String localStorageRaw) {
                  try {
                      capturedDiscountsJson = null;
                      activeStepId = "wv_" + System.currentTimeMillis();
                      activeLocalStorageRaw = localStorageRaw != null ? localStorageRaw : "{}";
                      webViewLatch = new CountDownLatch(1);

                      CountDownLatch initLatch = new CountDownLatch(1);
                      mainHandler.post(() -> {
                          try {
                              WebStorage.getInstance().deleteAllData();
                              CookieManager cm = CookieManager.getInstance();
                              cm.removeAllCookies(v -> {
                                  setCookiesForAllDomains(cm, cookiesRaw);
                                  cm.flush();
                                  webView.clearCache(true);
                                  webView.loadUrl("https://app.tapsi.cab/discount-center/");
                                  initLatch.countDown();
                              });
                          } catch (Exception e) {
                              initLatch.countDown();
                          }
                      });

                      initLatch.await(5, TimeUnit.SECONDS);
                      webViewLatch.await(12, TimeUnit.SECONDS);
                      return capturedDiscountsJson;
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void setCookiesForAllDomains(CookieManager cm, String rawCookies) {
                  if (rawCookies == null || rawCookies.trim().isEmpty()) return;
                  String[] parts = rawCookies.split(";");
                  for (String domain : TARGET_DOMAINS) {
                      String host = domain.startsWith(".") ? domain.substring(1) : domain;
                      String url = "https://" + host;
                      for (String part : parts) {
                          String trimmed = part.trim();
                          if (trimmed.isEmpty()) continue;
                          int eq = trimmed.indexOf('=');
                          if (eq <= 0) continue;
                          String name = trimmed.substring(0, eq).trim();
                          String val = trimmed.substring(eq + 1).trim();
                          if (RESERVED_COOKIE_ATTRS.contains(name.toLowerCase(Locale.ROOT))) continue;
                          cm.setCookie(url, name + "=" + val + "; Domain=" + domain + "; Path=/; Secure");
                      }
                  }
              }

              // ==========================================
              // ساخت و ذخیره گزارش متنی (.txt)
              // ==========================================
              private String buildFormattedTxtReport() {
                  StringBuilder sb = new StringBuilder();
                  String dateStr = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());

                  List<AccountDiscountResult> snapshot;
                  synchronized (resultsList) {
                      snapshot = new ArrayList<>(resultsList);
                  }

                  boolean onlyWithDisc = onlyWithDiscountsCheck != null && onlyWithDiscountsCheck.isChecked();
                  int totalWithDisc = 0;
                  int totalDiscItems = 0;
                  for (AccountDiscountResult r : snapshot) {
                      if (r.hasDiscounts()) totalWithDisc++;
                      totalDiscItems += r.discounts.size();
                  }

                  sb.append("============================================================\n");
                  sb.append("         گزارش جامع بررسی تخفیف اکانت‌های تپسی (TAPSI)\n");
                  sb.append("============================================================\n");
                  sb.append("تاریخ تهیه گزارش : ").append(dateStr).append("\n");
                  sb.append("کل لایسنس‌های بررسی‌شده : ").append(snapshot.size()).append("\n");
                  sb.append("اکانت‌های دارای تخفیف   : ").append(totalWithDisc).append("\n");
                  sb.append("مجموع کدها و تخفیف‌ها   : ").append(totalDiscItems).append("\n");
                  sb.append("============================================================\n\n");

                  List<AccountDiscountResult> filtered = new ArrayList<>();
                  for (AccountDiscountResult r : snapshot) {
                      if (onlyWithDisc && !r.hasDiscounts()) continue;
                      if (!"ALL".equals(selectedServiceFilter)) {
                          boolean anyMatch = false;
                          for (DiscountItemModel d : r.discounts) {
                              if (d.matchesFilter(selectedServiceFilter)) {
                                  anyMatch = true;
                                  break;
                              }
                          }
                          if (!anyMatch) continue;
                      }
                      filtered.add(r);
                  }

                  if (filtered.isEmpty()) {
                      sb.append("هیچ موردی مطابق با فیلتر فعلی یافت نشد.\n");
                      return sb.toString();
                  }

                  for (AccountDiscountResult acc : filtered) {
                      sb.append("------------------------------------------------------------\n");
                      sb.append("🔑 لایسنس (License) : ").append(acc.licenseKey).append("\n");
                      if (!acc.phone.isEmpty() || !acc.userId.isEmpty()) {
                          sb.append("👤 مشخصات اکانت     : ")
                                  .append(!acc.phone.isEmpty() ? acc.phone : "بدون شماره")
                                  .append(!acc.userId.isEmpty() ? " (ID: " + acc.userId + ")" : "")
                                  .append("\n");
                      }
                      sb.append("🌐 پروکسی استفاده‌شده: ").append(acc.proxyUsed).append("\n");

                      List<DiscountItemModel> matching = new ArrayList<>();
                      for (DiscountItemModel d : acc.discounts) {
                          if (d.matchesFilter(selectedServiceFilter)) matching.add(d);
                      }

                      if (!acc.success) {
                          sb.append("❌ وضعیت بررسی      : خطا (").append(acc.errorMessage).append(")\n");
                      } else if (matching.isEmpty() && (acc.questSummary == null || acc.questSummary.isEmpty())) {
                          sb.append("ℹ️ وضعیت تخفیف      : بدون تخفیف فعال\n");
                      } else {
                          sb.append("✅ تعداد تخفیف فعال : ").append(matching.size()).append(" مورد\n\n");
                          for (int j = 0; j < matching.size(); j++) {
                              DiscountItemModel d = matching.get(j);
                              sb.append("   [").append(j + 1).append("] سرویس      : ").append(d.getServicesLabel()).append("\n");
                              sb.append("       عنوان تخفیف : ").append(d.title).append("\n");
                              if (d.couponCode != null && !d.couponCode.isEmpty()) {
                                  sb.append("       کد تخفیف    : ").append(d.couponCode).append("\n");
                              }
                              if (d.description != null && !d.description.isEmpty()) {
                                  sb.append("       توضیحات     : ").append(d.description).append("\n");
                              }
                              if (d.ventureDescription != null && !d.ventureDescription.isEmpty()) {
                                  sb.append("       نحوه استفاده: ").append(d.ventureDescription).append("\n");
                              }
                              if (d.expiring) {
                                  sb.append("       هشدار انقضا : ⏳ در حال انقضا\n");
                              }
                              sb.append("\n");
                          }
                          if (acc.questSummary != null && !acc.questSummary.isEmpty()) {
                              sb.append("   [🎯 مأموریت فعال] : ").append(acc.questSummary).append("\n");
                          }
                      }
                  }

                  sb.append("\n============================================================\n");
                  sb.append("     لیست خلاصه (لایسنس + تخفیف‌ها در یک خط برای کپی سریع)\n");
                  sb.append("============================================================\n");
                  for (AccountDiscountResult acc : filtered) {
                      if (!acc.hasDiscounts()) continue;
                      List<String> parts = new ArrayList<>();
                      for (DiscountItemModel d : acc.discounts) {
                          if (!d.matchesFilter(selectedServiceFilter)) continue;
                          String c = (d.couponCode != null && !d.couponCode.isEmpty()) ? " [کد: " + d.couponCode + "]" : "";
                          parts.add(d.getServicesLabel() + ": " + d.title + " (" + d.description + ")" + c);
                      }
                      if (!parts.isEmpty()) {
                          sb.append(acc.licenseKey).append("  ===>  ").append(TextUtils.join(" | ", parts)).append("\n");
                      }
                  }

                  return sb.toString();
              }

              private void triggerSaveTxtReport(boolean openSystemFilePicker) {
                  if (resultsList.isEmpty()) {
                      Toast.makeText(this, "⚠️ هنوز هیچ لایسنسی بررسی نشده است", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  pendingReportToSave = buildFormattedTxtReport();
                  String fileName = "Tapsi_Discounts_" + System.currentTimeMillis() + ".txt";

                  // ۱. ذخیره مستقیم در پوشه Downloads
                  try {
                      File dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (dlDir != null) {
                          if (!dlDir.exists()) dlDir.mkdirs();
                          File outFile = new File(dlDir, fileName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(pendingReportToSave.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          appendLog("💾 فایل متنی گزارش در پوشه Download ذخیره شد: " + outFile.getAbsolutePath());
                          Toast.makeText(this, "✅ ذخیره شد: Download/" + fileName, Toast.LENGTH_LONG).show();
                      }
                  } catch (Exception ignored) {}

                  // ۲. کپی در کلیپ‌بورد
                  copyToClipboard("Tapsi_Discounts_Report", pendingReportToSave);

                  // ۳. باز کردن پنجره انتخاب مسیر ذخیره اندروید (Save As) در صورت درخواست
                  if (openSystemFilePicker && Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("text/plain");
                          intent.putExtra(Intent.EXTRA_TITLE, fileName);
                          startActivityForResult(intent, REQ_CREATE_TXT_FILE);
                      } catch (Exception e) {
                          Toast.makeText(this, "✅ گزارش در Download و کلیپ‌بورد ذخیره شد", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_CREATE_TXT_FILE && resultCode == Activity.RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      if (uri != null && pendingReportToSave != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                              if (os != null) {
                                  os.write(pendingReportToSave.getBytes(StandardCharsets.UTF_8));
                                  os.flush();
                                  appendLog("✅ گزارش متنی با موفقیت در مسیر انتخابی ذخیره شد.");
                                  Toast.makeText(this, "✅ فایل گزارش با موفقیت ذخیره شد!", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(this, "❌ خطا در ذخیره فایل: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  }
              }

