                  bg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  tv.setBackground(bg);
                  return tv;
              }

              private Button createActionButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(10));
                  if (strokeHex != null) bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  btn.setBackground(bg);
                  return btn;
              }

              private Button createSmallButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  btn.setPadding(dp(10), dp(4), dp(10), dp(4));
                  btn.setMinHeight(0);
                  btn.setMinimumHeight(0);
                  btn.setMinWidth(0);
                  btn.setMinimumWidth(0);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(8));
                  if (strokeHex != null) bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  btn.setBackground(bg);
                  return btn;
              }

              private void appendLog(String msg) {
                  String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                  mainHandler.post(() -> {
                      if (logView != null) {
                          logView.append("[" + time + "] " + msg + "\n");
                          if (logScrollView != null) {
                              logScrollView.post(() -> logScrollView.fullScroll(View.FOCUS_DOWN));
                          }
                      }
                  });
              }

              private void updateStatus(String text, String colorHex, int progress) {
                  mainHandler.post(() -> {
                      if (statusBadge != null) {
                          statusBadge.setText(text);
                          statusBadge.setTextColor(Color.parseColor(colorHex));
                      }
                      if (progressBar != null) {
                          progressBar.setProgress(progress);
                      }
                  });
              }

              private void pasteIntoEditText(EditText target) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip() && cm.getPrimaryClip() != null && cm.getPrimaryClip().getItemCount() > 0) {
                      CharSequence txt = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      if (txt != null && txt.length() > 0) {
                          String cur = target.getText().toString().trim();
                          target.setText(cur.isEmpty() ? txt.toString().trim() : cur + "\n" + txt.toString().trim());
                          refreshCountsUI();
                      }
                  }
              }

              private void copyToClipboard(String label, String text) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) {
                      cm.setPrimaryClip(ClipData.newPlainText(label, text));
                  }
              }

              private String maskKey(String key) {
                  if (key == null || key.length() <= 10) return key != null ? key : "";
                  return key.substring(0, 6) + "..." + key.substring(key.length() - 4);
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          value,
                          getResources().getDisplayMetrics()
                  );
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tapsi-Discount-Checker-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Discount-Checker-APK
          path: Tapsi-Discount-Checker-v1.0.apk

      - name: Create GitHub Release (Optional Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Tapsi Discount Checker APK (Build #${{ github.run_number }})"
          files: Tapsi-Discount-Checker-v1.0.apk
