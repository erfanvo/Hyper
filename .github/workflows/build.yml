              // ابزار ۲: بررسی زنده نشست و تشخیص شماره موبایل
              // ==========================================
              private void inspectCurrentSession() {
                  webView.evaluateJavascript(
                          "(function() { return JSON.stringify(window.localStorage); })();",
                          value -> {
                              String raw = unwrapJsString(value);
                              if (raw == null || raw.isEmpty() || "{}".equals(raw.trim())) {
                                  Toast.makeText(this, "⚠️ لوکال‌استورج خالی است؛ هنوز وارد حساب نشده‌اید.", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              try {
                                  JSONObject obj = new JSONObject(raw);
                                  int count = obj.length();
                                  String phone = detectPhoneFromStorage(raw);
                                  new AlertDialog.Builder(this)
                                          .setTitle("🔍 وضعیت نشست فعلی اسنپ")
                                          .setMessage(
                                                  "📱 شماره تشخیص داده شده: " + phone + "\n\n" +
                                                  "🗂 تعداد کلیدهای LocalStorage: " + count + "\n\n" +
                                                  "وضعیت: " + (count > 2 ? "✅ آماده ساخت لایسنس" : "⚠️ اطلاعات ناقص")
                                          )
                                          .setPositiveButton("⚡ ساخت لایسنس همین نشست", (d, w) -> extractAndCreateLicense())
                                          .setNegativeButton("بستن", null)
                                          .show();
                              } catch (Exception e) {
                                  Toast.makeText(this, "❌ خطا در بررسی نشست", Toast.LENGTH_SHORT).show();
                              }
                          }
                  );
              }

              private String detectPhoneFromStorage(String rawStorage) {
                  if (rawStorage == null) return "نامشخص";
                  Pattern p = Pattern.compile("(?:\\+98|0098|98|0)?(9\\d{9})\\b");
                  Matcher m = p.matcher(rawStorage);
                  if (m.find()) {
                      return "0" + m.group(1);
                  }
                  return "نامشخص";
              }

